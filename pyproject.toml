# -----------------------------------------------
# Python drift engine (Phase 4), AI analysis engine (Phase 6) and Activity Log
# collector (Phase 7)
# -----------------------------------------------
# Setup (from the repository root):
#   python3 -m venv .venv
#   source .venv/bin/activate
#   pip install -r requirements.txt   # full dev setup, pinned by ci/*-constraints.txt (Task 12.1)
#   pip install -e ".[dev,ai,azure,dashboard]"  # the same extras with the unpinned pyproject.toml ranges
#   pip install -e ".[dev]"           # drift engine only; the AI engine and Azure SDK tests are skipped
# -----------------------------------------------

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-engine"
version = "0.1.0"
description = "Deterministic Terraform drift detection engine for the AI-Powered Terraform Drift Detector."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Harsh Agarwal" }]
requires-python = ">=3.11"
# Runtime dependencies. The CLI (Task 4.6) uses the standard library's argparse,
# like scripts/detect_drift.py, so no CLI framework is required.
dependencies = [
    "pydantic>=2.11,<3",   # 2.11+: validate_by_name / serialize_by_alias (models.py)
    "PyYAML>=6.0,<7",      # --format yaml (formatters.py)
]

[project.scripts]
drift-engine = "drift_engine.cli:main"
# Task 9A.1: separate entry point, so drift-engine never needs the LLM stack (needs the ai extra).
ai-analysis = "ai_engine.cli:main"
# Task 13.1: dashboard data API on a loopback address (needs the dashboard extra).
dashboard-api = "dashboard_api.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",          # Task 4.7 coverage gate
    "jsonschema>=4.23,<5",    # validates reports against schemas/drift_report.schema.json
]
# AI analysis engine (Phase 6, src/ai_engine). Opt-in so that deterministic drift
# detection (`pip install .`, used by the drift workflow) never depends on an LLM stack.
ai = [
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",   # ChatOpenAI / AzureChatOpenAI (pulls in openai)
]
# Azure Activity Log collector (Phase 7, drift_engine.activity_logs, `drift-engine
# activity-logs`). Opt-in: imported only when that command has drift to look up, so
# `drift-engine analyze` and the drift workflow never depend on the Azure SDK.
azure = [
    "azure-mgmt-monitor>=7,<8",   # MonitorManagementClient.activity_logs (Activity Log API 2015-04-01)
    "azure-identity>=1.19,<2",    # AzureCliCredential (az login / azure/login OIDC session)
]
# Dashboard data API (Phase 13, src/dashboard_api, `dashboard-api`). Opt-in: the drift and AI
# workflows never install it. The caller lookup also needs the azure extra.
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drift_engine = ["py.typed"]
ai_engine = ["py.typed"]
dashboard_api = ["py.typed"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Task 4.7 gate: pytest --cov=src/drift_engine tests/ fails below this.
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
# pytest also runs the existing unittest-based suite (tests/test_detect_drift.py).
testpaths = ["tests"]
addopts = "-ra"
# Task 12.1 test tiers (Decision 4). The fast tier is every test with neither
# marker: pytest -m "not integration and not mutation". The full suite runs all.
markers = [
    "integration: runs a subprocess, bash harness, git or a loopback server",
    "mutation: mutation, fuzz or leak-scan loop over many variants",
]
