name: "Phase 5 - Drift Detection"

# Continuous drift monitoring: a daily scheduled scan plus on-demand manual runs.
#
# Implemented so far: triggers and environment selection (Task 5.1), Azure OIDC
# login and Terraform init/validate against the remote backend (Task 5.2), plan
# evidence via scripts/generate_plan_json.sh and classification via
# `drift-engine analyze` (Task 5.3), the report artifact (Task 5.4), failure
# reporting with the `drift_detected` output (Task 5.5), one GitHub Issue per
# drifted resource (Task 8.1), evidence-based closing of those issues once the
# resource is no longer drifted (Task 8.3), an Infracost cost estimate of the
# same plan (Task 10.1), the public drift report (Task 9B.4A) and the drift
# investigation (Task 9B.5) and the unmanaged resource inventory with its list-price
# estimate (Task 10.4).
#
# Jobs: preflight -> plan-and-analyze -> issues / cost / investigation / unmanaged / report.
#   preflight         main-branch guard and environment/path validation.
#   plan-and-analyze  OIDC, state storage check (the account's own state only),
#                     Terraform init/validate, plan evidence, drift-engine
#                     analyze, and upload of the two-file report artifact. Plan
#                     generation and analysis share one job on purpose: raw plan
#                     evidence (tfplan, plan.json, plan.log) must never leave this
#                     ephemeral runner (spec §8.3), so it is never passed between
#                     jobs. Task 9B.4A/9B.5: `analyze` writes the internal report to
#                     a runner-only directory and the PUBLIC report (identifiers
#                     withheld) beside the manifest; only the public report and the
#                     manifest are uploaded. Then the drift investigation (Activity
#                     Log, Reader) runs and uploads only its public file.
#   issues            Tasks 8.1/8.3: one GitHub Issue per drifted resource when
#                     drift_detected is the literal "true"; closes issues whose
#                     resource is present and no longer drifted when it is "true"
#                     or "false" (never for "unknown"). Least privilege
#                     (contents: read, issues: write; no id-token, no Azure); reads
#                     only this run's drift report artifact (no raw plan evidence).
#                     Issue publication relies on the workflow-level concurrency
#                     group below (runs are serialized per environment).
#   cost              Task 10.1: fails unless the cost steps at the end of
#                     plan-and-analyze succeeded and their sanitised
#                     infracost-report artifact passes the sanitiser's check mode;
#                     writes a totals-only summary. Least privilege (contents: read;
#                     no id-token, no Azure, no secrets). Cost is informational: a
#                     cost failure turns the run red but never changes
#                     drift_detected, the drift report, issues or the report job.
#   investigation     Task 9B.5 (G18): passes when the drift investigation
#                     succeeded, or is incomplete (with a warning), and its upload
#                     succeeded and the downloaded public investigation binds to the
#                     downloaded public drift report; fails when it failed. It is
#                     required only for a drifted run: one that never ran fails a
#                     drifted run and passes a no-drift run. Counts-only summary.
#                     Least privilege (contents: read; no id-token, no Azure, no
#                     secrets). Never changes drift_detected, the drift report or
#                     artifact, issues, cost or the report job.
#   unmanaged         Task 10.4: prices the public unmanaged inventory (uploaded by
#                     plan-and-analyze, Reader, read-only) with the public Azure Retail
#                     Prices API, verifies it, uploads unmanaged-resources-<run_id> and
#                     writes the summary. Unmanaged resources are a finding (warning),
#                     never drift; a failed or incomplete inventory or a Retail Prices
#                     API failure fails this job. Least privilege (contents: read; no
#                     id-token, no Azure, no secrets).
#   report            run summary, also after failures (reporting only).
#
# CI result policy (PROJECT_PLAN.md Phase 9B G18). Run status reflects process
# validity only:
#   no drift                -> success, drift_detected=false
#   drift                   -> success, drift_detected=true; drift is a finding,
#                              visible in the warning, summary, issues and report
#   detection/process error -> failure, drift_detected=unknown (never "no drift")
#   investigation incomplete -> success with a warning; investigation failed (or
#                              required and never ran) -> the investigation job fails
#   cost or issues failure  -> that job fails; drift_detected is unchanged
#   unmanaged resources     -> success with a warning (Task 10.4, not drift); a failed or
#                              incomplete inventory or a pricing API failure fails the
#                              unmanaged job; drift_detected is unchanged
# Terraform plan exit 2 means pending changes, not necessarily drift: the
# classification decides drift, and exit 2 is never a failure or "unknown".
#
# Job outputs (Task 5.5), on plan-and-analyze and repeated on report (which also
# yields "unknown" when plan-and-analyze never ran):
#   drift_detected  "true" / "false" only for a valid classification; "unknown"
#                   for any failure or when analysis did not run. Consumers must
#                   test for the literal "true" or "false", never for emptiness.
#   drift_status    "detected" / "none" / "UNKNOWN".
#
# Detection is read-only: this workflow must never run `terraform apply`.

on:
  schedule:
    # Daily at 02:00 UTC. GitHub runs scheduled workflows from the default
    # branch only, which matches the existing `ref:refs/heads/main` OIDC subject.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform environment to scan (terraform/environments/<name>)"
        type: choice
        required: true
        default: dev
        options:
          - dev

# Least privilege: the workflow default is `contents: read` (checkout) only. The
# `plan-and-analyze` job grants itself `id-token: write` so azure/login can request
# the GitHub OIDC token (exchanged for a short-lived Azure token); no other job can
# request one. No client secret, storage account key or SAS token is used anywhere.
permissions:
  contents: read

env:
  # Same pin as terraform-auth-test.yml and scripts/generate_plan_json.sh; the
  # remote dev.tfstate was written by this version.
  TERRAFORM_VERSION: "1.14.7"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

# One scan per environment at a time; a queued run waits rather than cancelling
# a scan that is already reading state.
concurrency:
  group: drift-detection-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

# Deliberately NO job-level `environment:` key on any job. Setting one changes
# the OIDC token subject to `...:environment:<name>`, which would not match the
# only federated credential (`...:ref:refs/heads/main`) and would require a new
# Azure federated credential. The input selects a Terraform directory only.
jobs:
  preflight:
    name: "Preflight (${{ github.event.inputs.environment || 'dev' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Scheduled runs carry no inputs, so they default to `dev`.
      DRIFT_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    outputs:
      environment: ${{ steps.context.outputs.environment }}
      working_directory: ${{ steps.context.outputs.working_directory }}
      var_file: ${{ steps.context.outputs.var_file }}
      # Step outcomes for the run summary (success, failure or skipped).
      guard_outcome: ${{ steps.guard.outcome }}
      checkout_outcome: ${{ steps.checkout.outcome }}
      context_outcome: ${{ steps.context.outcome }}

    steps:
      # Azure trusts only `ref:refs/heads/main` tokens, and scanning must reflect
      # the reviewed configuration on main, not an arbitrary branch.
      - name: Require main branch
        id: guard
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Drift detection runs only from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Checkout Code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve Environment
        id: context
        run: |
          set -euo pipefail
          env_name="${DRIFT_ENVIRONMENT}"
          # Defense in depth: the choice input already restricts values, but a
          # name reaching a path must never contain separators or traversal.
          if ! printf '%s' "${env_name}" | grep -Eq '^[a-z0-9-]+$'; then
            echo "::error::Invalid environment name: '${env_name}'."
            exit 1
          fi
          work_dir="terraform/environments/${env_name}"
          var_file="${env_name}.tfvars"
          if [ ! -d "${work_dir}" ]; then
            echo "::error::Environment directory not found: ${work_dir}"
            exit 1
          fi
          if [ ! -f "${work_dir}/${var_file}" ]; then
            echo "::error::Variable file not found: ${work_dir}/${var_file}"
            exit 1
          fi
          {
            echo "environment=${env_name}"
            echo "working_directory=${work_dir}"
            echo "var_file=${var_file}"
          } >> "${GITHUB_OUTPUT}"

  plan-and-analyze:
    name: "Terraform Plan & Drift Analysis (${{ github.event.inputs.environment || 'dev' }})"
    needs: preflight
    runs-on: ubuntu-latest
    # Task 9B.5 (G10): the drift investigation waits until the observation end + 10 min
    # and polls up to + 20 min (G8), bounded inside its script (no step timeout).
    timeout-minutes: 45
    # Job-level block (replaces the workflow-level one for this job): id-token for the
    # OIDC login, contents for checkout, actions: read for the anchor fetch (G9).
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      DRIFT_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    outputs:
      # `||` falls back only when the step output is empty (analysis skipped or
      # never reached); a valid "false" is a non-empty string and passes through.
      drift_detected: ${{ steps.analyze.outputs.drift_detected || 'unknown' }}
      drift_status: ${{ steps.analyze.outputs.drift_status || 'UNKNOWN' }}
      # Reporting values for the run summary (raw plan evidence is never passed).
      plan_exit_code: ${{ steps.evidence.outputs.plan_exit_code }}
      classification_counts: ${{ steps.analyze.outputs.classification_counts }}
      checkout_outcome: ${{ steps.checkout.outcome }}
      login_outcome: ${{ steps.login.outcome }}
      auth_outcome: ${{ steps.auth.outcome }}
      state_guard_outcome: ${{ steps.state_guard.outcome }}
      tf_setup_outcome: ${{ steps.tf_setup.outcome }}
      tf_init_outcome: ${{ steps.tf_init.outcome }}
      tf_validate_outcome: ${{ steps.tf_validate.outcome }}
      py_setup_outcome: ${{ steps.py_setup.outcome }}
      install_outcome: ${{ steps.install.outcome }}
      evidence_outcome: ${{ steps.evidence.outcome }}
      analyze_outcome: ${{ steps.analyze.outcome }}
      upload_outcome: ${{ steps.upload.outcome }}
      # Task 10.1 cost status, consumed only by the cost job (never by issues/report).
      # Empty when the cost steps did not run; the cost job then fails.
      cost_status: ${{ steps.cost.outputs.cost_status }}
      cost_failure: ${{ steps.cost.outputs.cost_failure }}
      cost_upload_outcome: ${{ steps.cost_upload.outcome }}
      # Task 9B.5 investigation status, consumed only by the investigation job.
      investigation_status: ${{ steps.investigation.outputs.investigation_status }}
      investigation_failure: ${{ steps.investigation.outputs.investigation_failure }}
      investigation_detail: ${{ steps.investigation.outputs.investigation_detail }}
      investigation_publishable: ${{ steps.investigation.outputs.investigation_publishable }}
      investigation_upload_outcome: ${{ steps.investigation_upload.outcome }}
      # Task 10.4 unmanaged inventory status, consumed only by the unmanaged job.
      inventory_status: ${{ steps.inventory.outputs.inventory_status }}
      inventory_failure: ${{ steps.inventory.outputs.inventory_failure }}
      inventory_detail: ${{ steps.inventory.outputs.inventory_detail }}
      inventory_unmanaged: ${{ steps.inventory.outputs.inventory_unmanaged }}
      inventory_publishable: ${{ steps.inventory.outputs.inventory_publishable }}
      inventory_upload_outcome: ${{ steps.inventory_upload.outcome }}

    steps:
      # Same commit as preflight (checkout defaults to github.sha); this runner
      # needs the Terraform configuration, the scripts and the package source.
      - name: Checkout Code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # OIDC only: the token subject is `...:ref:refs/heads/main`, matching the
      # existing federated credential (enforced by the preflight main-branch guard).
      - name: Azure OIDC Login
        id: login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fail at the auth boundary rather than as a confusing backend error later.
      # Task 12.1A (P3): the context is compared with the configured values and
      # never printed (no reliance on secret masking); only a fixed line or a fixed
      # failure code reaches the public log.
      - name: Verify Azure OIDC Authentication
        id: auth
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set +x
          set -uo pipefail
          norm() { printf '%s' "$1" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'; }
          if [ -z "${EXPECTED_SUBSCRIPTION_ID:-}" ] || [ -z "${EXPECTED_TENANT_ID:-}" ]; then
            echo "::error::Azure auth check failed: failure_code=auth_configuration_missing"
            exit 1
          fi
          if ! actual_subscription="$(az account show --only-show-errors --query id --output tsv 2>/dev/null)" \
            || ! actual_tenant="$(az account show --only-show-errors --query tenantId --output tsv 2>/dev/null)" \
            || [ -z "$(norm "${actual_subscription}")" ] || [ -z "$(norm "${actual_tenant}")" ]; then
            echo "::error::Azure auth check failed: failure_code=auth_context_unavailable"
            exit 1
          fi
          if [ "$(norm "${actual_subscription}")" != "$(norm "${EXPECTED_SUBSCRIPTION_ID}")" ] \
            || [ "$(norm "${actual_tenant}")" != "$(norm "${EXPECTED_TENANT_ID}")" ]; then
            echo "::error::Azure auth check failed: failure_code=auth_context_mismatch"
            exit 1
          fi
          echo "Azure OIDC context verified (subscription and tenant match the configured values; not printed)."

      # Account switching (docs/azure-account-switching.md): dev/backend.tf is a partial
      # backend. The state location comes from repository variables and is written to a
      # runner-local file only after the storage account is proven to belong to the
      # signed-in subscription (read-only, Reader), so a run can never read or lock an
      # earlier account's state. Only the state key and fixed lines are printed.
      - name: Verify Terraform State Storage
        id: state_guard
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          BACKEND_CONFIG: ${{ runner.temp }}/backend.hcl
        run: ./scripts/resolve_backend_config.sh

      # Wrapper disabled so later steps see Terraform's real exit codes and
      # unmodified stdout (needed for `plan -detailed-exitcode` and JSON output).
      - name: Setup Terraform
        id: tf_setup
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Remote AzureRM backend (the verified file above), authenticated end to end with OIDC:
      #   ARM_USE_OIDC    - exchange the GitHub ID token for an Azure token
      #   ARM_USE_AZUREAD - Entra ID for the state blob instead of storage keys
      # -lockfile=readonly: use the committed provider lock as-is; never rewrite it.
      # -reconfigure: always the current account's backend; never -migrate-state.
      - name: Terraform Init (remote backend)
        id: tf_init
        env:
          WORK_DIR: ${{ needs.preflight.outputs.working_directory }}
          BACKEND_CONFIG: ${{ runner.temp }}/backend.hcl
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: |
          set -euo pipefail
          terraform version
          terraform -chdir="${WORK_DIR}" init -input=false -reconfigure -backend-config="${BACKEND_CONFIG}" \
            -lockfile=readonly -no-color

      - name: Terraform Validate
        id: tf_validate
        env:
          WORK_DIR: ${{ needs.preflight.outputs.working_directory }}
        run: |
          set -euo pipefail
          terraform -chdir="${WORK_DIR}" validate -no-color

      - name: Setup Python
        id: py_setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Runtime dependencies only (pydantic, PyYAML); no dev/test extras.
      - name: Install drift-engine
        id: install
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input .
          drift-engine --version

      # Phase 3 contract (docs/drift-detection-spec.md §4-§5): the script runs
      # init, `plan -detailed-exitcode -out` (refresh and locking on), then
      # `show -json` on that same plan file, and applies the integrity gate. It
      # never applies. Script exit: 0 = valid evidence (plan exit 0 or 2, read
      # from the manifest), 1 = detection failed, 64 = unusable ARTIFACT_DIR.
      # The exit code is captured explicitly so plan exit 2 is never a failure.
      # Evidence lives in RUNNER_TEMP, outside the checkout.
      - name: Generate Plan Evidence
        id: evidence
        env:
          WORK_DIR: ${{ needs.preflight.outputs.working_directory }}
          VAR_FILE: ${{ needs.preflight.outputs.var_file }}
          ARTIFACT_DIR: ${{ runner.temp }}/drift
          BACKEND_CONFIG: ${{ runner.temp }}/backend.hcl
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: |
          set -euo pipefail
          # The script's var-file is fixed to dev.tfvars (Phase 3 MVP scope).
          if [ "${VAR_FILE}" != "dev.tfvars" ]; then
            echo "::error::generate_plan_json.sh supports dev.tfvars only (got ${VAR_FILE}). Drift status: UNKNOWN."
            exit 1
          fi

          script_rc=0
          TF_DIR="${GITHUB_WORKSPACE}/${WORK_DIR}" ./scripts/generate_plan_json.sh || script_rc=$?

          manifest="${ARTIFACT_DIR}/detection_run.json"
          manifest_present=false
          outcome=missing
          plan_rc=none
          failure="no run manifest was written"
          # Exit 64 = unusable ARTIFACT_DIR: no manifest was written by this run,
          # so any file already there is stale and must not be read as evidence.
          if [ "${script_rc}" -eq 64 ]; then
            failure="unusable ARTIFACT_DIR (script exit 64); no evidence was produced"
          elif [ -f "${manifest}" ]; then
            manifest_present=true
            outcome="$(jq -r '.outcome // "invalid"' "${manifest}" 2>/dev/null || echo invalid)"
            plan_rc="$(jq -r '.plan_exit_code // "none"' "${manifest}" 2>/dev/null || echo none)"
            failure="$(jq -r '"[\(.failure_stage // "unknown")] \(.failure_reason // "unknown")"' "${manifest}" 2>/dev/null || echo "manifest unreadable")"
          fi

          # Task 5.2 initialized with -lockfile=readonly; the script's own init must
          # not have altered the committed provider lock either.
          lock_ok=true
          if ! git diff --quiet -- "${WORK_DIR}/.terraform.lock.hcl"; then
            lock_ok=false
            failure="provider lock file was modified during detection"
          fi

          {
            echo "script_exit_code=${script_rc}"
            echo "manifest_present=${manifest_present}"
            echo "outcome=${outcome}"
            echo "plan_exit_code=${plan_rc}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${script_rc}" -eq 0 ] && [ "${outcome}" = "succeeded" ] && [ "${lock_ok}" = true ]; then
            case "${plan_rc}" in
              0) echo "Valid plan evidence: terraform plan exit 0 (no pending changes)." ;;
              2) echo "Valid plan evidence: terraform plan exit 2 (pending changes; classification decides drift)." ;;
              *) echo "::error::Script succeeded but manifest plan_exit_code is '${plan_rc}'. Drift status: UNKNOWN."
                 exit 1 ;;
            esac
            exit 0
          fi

          # Task 12.1A (P4): the runner-local plan evidence is never printed; its tail
          # could hold planned attribute values. This line carries the stage and the
          # script's fixed failure reason only.
          echo "::error::Drift detection FAILED (script exit ${script_rc}, outcome ${outcome}, plan exit ${plan_rc}): ${failure}. Drift status: UNKNOWN."
          exit 1

      # Classification is entirely drift-engine's (Phase 4); this step only maps
      # its exit code. It also runs after a failed detection whenever a manifest
      # exists, so the failed run gets an explicit outcome=failed report
      # (has_drift null), as spec §8.2 requires. The full integrity gate is
      # re-applied by the engine because --manifest is always passed.
      # Task 9B.4A/9B.5 (item 1): the internal report goes to a runner-only directory
      # (never uploaded; `investigate` reads it); the PUBLIC report (identifiers
      # withheld, verified and scanned by the engine) stays at drift/drift_report.json
      # beside the manifest, so the artifact root, the upload paths and the cost
      # step's DRIFT_REPORT are unchanged. Validity is read from the public file.
      #   engine exit 0 = valid classification (drift or not); anything else
      #   (1 evidence rejected, 70 internal or public_projection_failed, 73 write
      #   error, ...) = UNKNOWN, and nothing is uploaded.
      - name: Analyze Drift
        id: analyze
        if: ${{ !cancelled() && steps.evidence.outputs.manifest_present == 'true' }}
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/drift
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          report="${ARTIFACT_DIR}/drift_report.json"
          internal_dir="${RUNNER_TEMP}/drift-internal"
          mkdir -m 0700 "${internal_dir}"
          engine_rc=0
          drift-engine analyze \
            --plan "${ARTIFACT_DIR}/plan.json" \
            --manifest "${ARTIFACT_DIR}/detection_run.json" \
            --output "${internal_dir}/drift_report.json" \
            --public-output "${report}" || engine_rc=$?
          echo "engine_exit_code=${engine_rc}" >> "${GITHUB_OUTPUT}"

          has_drift=unknown
          report_outcome=missing
          if [ -f "${report}" ] && [ -f "${internal_dir}/drift_report.json" ] \
             && [ "$(jq -r '.public_version // "none"' "${report}" 2>/dev/null || echo none)" = "1" ]; then
            report_outcome="$(jq -r '.outcome // "invalid"' "${report}" 2>/dev/null || echo invalid)"
            has_drift="$(jq -r 'if (.has_drift | type) == "boolean" then (.has_drift | tostring) else "unknown" end' "${report}" 2>/dev/null || echo unknown)"
          fi

          if [ "${engine_rc}" -eq 0 ] && [ "${EVIDENCE_OUTCOME}" = "success" ] \
             && [ "${report_outcome}" = "succeeded" ] && { [ "${has_drift}" = true ] || [ "${has_drift}" = false ]; }; then
            if [ "${has_drift}" = true ]; then drift_status=detected; else drift_status=none; fi
            {
              echo "has_drift=${has_drift}"
              echo "drift_detected=${has_drift}"
              echo "drift_status=${drift_status}"
              echo "classification_counts=$(jq -c '.summary.classification_counts' "${report}")"
            } >> "${GITHUB_OUTPUT}"
            echo "==> Drift summary"
            echo "has_drift: ${has_drift}"
            jq -r '"resources: \(.summary.resources_total), drifted: \(.summary.drifted_resources), ambiguous: \(.summary.ambiguous_resources), pending output changes: \(.summary.has_pending_output_changes)"' "${report}"
            jq -r '.resources[] | "  \(.classification)\t\(.address)"' "${report}"
            if [ "${has_drift}" = true ]; then
              echo "::warning::Drift detected in ${DRIFT_ENVIRONMENT} (a valid result, not a pipeline failure)."
            fi
            exit 0
          fi

          {
            echo "has_drift=unknown"
            echo "drift_detected=unknown"
            echo "drift_status=UNKNOWN"
          } >> "${GITHUB_OUTPUT}"
          if [ -f "${report}" ]; then
            jq -r '"report outcome: \(.outcome); failure: \(.failure // {} | "\(.source // "-")/\(.stage // "-"): \(.reason // "-")")"' "${report}" 2>/dev/null || true
          fi
          echo "::error::Drift classification not valid (engine exit ${engine_rc}, evidence ${EVIDENCE_OUTCOME}, report ${report_outcome}). Drift status: UNKNOWN."
          exit 1

      # Publishes only the PUBLIC drift report (Task 9B.4A: identifiers withheld;
      # sensitive values redacted by the engine) and the run manifest; the internal
      # report lives in drift-internal/ and is never uploaded. Raw plan evidence (tfplan, plan.json,
      # plan.log) is kept only on the ephemeral runner and is not uploaded: this is
      # a public repository and plan files can hold clear-text values (spec §8.3).
      # Default success() condition: runs only when evidence and analysis both
      # succeeded (drift or no drift). ARTIFACT_DIR is this job's RUNNER_TEMP, which
      # the evidence script required to be empty, so no stale files can be picked up.
      - name: Upload Drift Report
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drift-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/drift/drift_report.json
            ${{ runner.temp }}/drift/detection_run.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      # Task 10.4: unmanaged resource inventory (read-only, Reader): every resource group
      # Terraform manages in this plan is listed and each ARM ID is compared,
      # case-insensitively, with the IDs Terraform manages. Runs right after the drift
      # report upload (closest to the plan's refresh) and before the cost step's `az logout`.
      # Third documented always-exit-0 step (D5 pattern): scripts/inventory_analysis.sh
      # writes inventory_status / _failure / _detail / _unmanaged / _publishable and exits 0;
      # an unexpected script failure is mapped to `script_error`. Unmanaged resources are
      # not drift and never change this job, drift_detected, issues, cost, the investigation
      # or report; the unmanaged job reports the outcome (and fails on a failed inventory).
      # plan.json stays on this runner; only the public inventory (types, names, locations,
      # pricing inputs; never a resource ID) is uploaded. No step-level timeout: the script
      # bounds every blocking operation itself (venv 60 s, pip 180 s, pin check 30 s, inventory
      # 300 s with a 240 s Azure deadline, public check 45 s; worst case about 615 s).
      - name: Unmanaged Resource Inventory
        id: inventory
        if: ${{ steps.upload.outcome == 'success' && (steps.analyze.outputs.drift_detected == 'true' || steps.analyze.outputs.drift_detected == 'false') }}
        env:
          PLAN_JSON: ${{ runner.temp }}/drift/plan.json
          PUBLIC_REPORT: ${{ runner.temp }}/drift/drift_report.json
        run: |
          set -uo pipefail
          script_rc=0
          ./scripts/inventory_analysis.sh || script_rc=$?
          if [ "${script_rc}" -ne 0 ]; then
            {
              echo "inventory_status=failed"
              echo "inventory_failure=script_error"
              echo "inventory_detail=none"
              echo "inventory_unmanaged="
              echo "inventory_publishable=false"
            } >> "${GITHUB_OUTPUT}"
            rm -f "${RUNNER_TEMP}/unmanaged/public/unmanaged_inventory.json"
            echo "::error::Unmanaged resource inventory failed unexpectedly (script exit ${script_rc}); drift result unaffected; the unmanaged job reports it."
          fi
          exit 0

      # Task 10.4: third documented continue-on-error upload: the public inventory only,
      # whenever it passed the public check (any outcome, so a failed inventory is reported
      # with its codes). Its outcome is exported and the unmanaged job fails unless it is success.
      - name: Upload Unmanaged Inventory
        id: inventory_upload
        if: ${{ steps.inventory.outputs.inventory_publishable == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unmanaged-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/unmanaged/public/unmanaged_inventory.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      # Task 9B.5 (G8-G13, G10): drift investigation against the Azure Activity Log
      # (read-only, Reader), only after a valid classification whose drift report was
      # uploaded, and before the cost step (which runs `az logout`). Second documented
      # always-exit-0 step (D5 pattern): scripts/investigation_analysis.sh writes
      # investigation_status / _failure / _detail / _publishable and exits 0; the step
      # maps an unexpected script failure to `script_error` and exits 0, so the
      # investigation can never change this job's result, drift_detected, issues, cost
      # or report. The investigation job fails visibly instead. No step-level
      # timeout-minutes (a step timeout would fail this job and skip issues/cost):
      # the script bounds itself (timeout 1500 / 300). GH_TOKEN reaches only the
      # anchor fetch; the pipeline principal is compared on the runner, never written.
      - name: Drift Investigation
        id: investigation
        if: ${{ steps.upload.outcome == 'success' && (steps.analyze.outputs.drift_detected == 'true' || steps.analyze.outputs.drift_detected == 'false') }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_ENGINE_PIPELINE_PRINCIPAL: ${{ secrets.AZURE_CLIENT_ID }}
          DRIFT_DETECTED: ${{ steps.analyze.outputs.drift_detected }}
          PLAN_JSON: ${{ runner.temp }}/drift/plan.json
          MANIFEST: ${{ runner.temp }}/drift/detection_run.json
          INTERNAL_REPORT: ${{ runner.temp }}/drift-internal/drift_report.json
          PUBLIC_REPORT: ${{ runner.temp }}/drift/drift_report.json
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          script_rc=0
          ./scripts/investigation_analysis.sh || script_rc=$?
          if [ "${script_rc}" -ne 0 ]; then
            {
              echo "investigation_status=failed"
              echo "investigation_failure=script_error"
              echo "investigation_detail=none"
              echo "investigation_publishable=false"
            } >> "${GITHUB_OUTPUT}"
            rm -f "${RUNNER_TEMP}/investigation/public/drift_investigation.json"
            echo "::error::Drift investigation failed unexpectedly (script exit ${script_rc}); drift result unaffected; the investigation job reports it."
          fi
          exit 0

      # Task 9B.5 (G10): second documented continue-on-error upload: the public
      # investigation only, when publishable (succeeded, incomplete, or failed but
      # bindable: decision 1). Its outcome is exported and the investigation job
      # fails unless it is success. Restricted files never leave the runner.
      - name: Upload Drift Investigation
        id: investigation_upload
        if: ${{ steps.investigation.outputs.investigation_publishable == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drift-investigation-${{ github.run_id }}
          path: ${{ runner.temp }}/investigation/public/drift_investigation.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      # Task 10.1 (D5): Infracost cost estimate of the same plan.json, only after a
      # valid classification whose drift report was uploaded. Cost is informational:
      # the step records cost_status/cost_failure and ALWAYS exits 0 (the single
      # documented exit-code exception, D5), so a cost failure can never change this
      # job's result, drift_detected, the issues job or the report job. The cost job
      # fails visibly instead.
      # D1: the pinned v0.10.46 Linux binary is downloaded and SHA-256 verified
      # inside this step (never a separate step), so an install failure is the cost
      # failure `install_failed`. No Infracost action, image or install script.
      # D6: the only secret is INFRACOST_API_KEY; no ARM_*, AZURE_* or GITHUB_TOKEN.
      # The runner re-injects ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN into every run:
      # step of a job with id-token: write, after the step env: is applied (so
      # blanking them in env: is ineffective, run #20). The first command therefore
      # re-executes this step's shell without them (exec env -u: a clean re-exec
      # boundary); a failed exec continues and the script then fails closed with
      # oidc_token_present. The Azure CLI session is removed next (errors ignored;
      # scripts/infracost_analysis.sh fails closed if a session or an OIDC variable
      # remains). The script also enforces the D7 controls (incl.
      # CHECKPOINT_DISABLE=1) and the unexpected_egress check.
      - name: Infracost Cost Estimate
        id: cost
        if: ${{ steps.upload.outcome == 'success' && (steps.analyze.outputs.drift_detected == 'true' || steps.analyze.outputs.drift_detected == 'false') }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          PINNED_INFRACOST_VERSION: "0.10.46"
          PINNED_INFRACOST_LINUX_SHA256: "d0d081cd39b07b2ca5c315830bfc4bcdfb0183b04c19cb18835c154482a2c97b"
          PLAN_JSON: ${{ runner.temp }}/drift/plan.json
          DRIFT_REPORT: ${{ runner.temp }}/drift/drift_report.json
          RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          DRIFT_ENVIRONMENT: ${{ needs.preflight.outputs.environment }}
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            shopt -s execfail
            exec env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN bash --noprofile --norc -eo pipefail "$0" || true
          fi
          set -uo pipefail
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true

          archive="infracost-linux-amd64.tar.gz"
          bin_dir="${RUNNER_TEMP}/infracost-bin"
          installed=false
          if curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
               "https://github.com/infracost/infracost/releases/download/v${PINNED_INFRACOST_VERSION}/${archive}" \
             && echo "${PINNED_INFRACOST_LINUX_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c - \
             && mkdir "${bin_dir}" \
             && tar -xzf "${RUNNER_TEMP}/${archive}" -C "${bin_dir}" infracost-linux-amd64 \
             && mv "${bin_dir}/infracost-linux-amd64" "${bin_dir}/infracost" \
             && chmod 0755 "${bin_dir}/infracost"; then
            installed=true
          fi
          if [ "${installed}" != true ]; then
            {
              echo "cost_status=failed"
              echo "cost_failure=install_failed"
            } >> "${GITHUB_OUTPUT}"
            echo "::error::Infracost installation failed (cost failure, not a drift failure); the cost job reports it."
            echo "cost_status=failed cost_failure=install_failed"
            exit 0
          fi
          export PATH="${bin_dir}:${PATH}"

          # The script appends cost_status/cost_failure to GITHUB_OUTPUT itself (I2).
          script_rc=0
          ./scripts/infracost_analysis.sh || script_rc=$?
          if [ "${script_rc}" -ne 0 ]; then
            echo "::error::Cost estimate failed (script exit ${script_rc}); drift result unaffected; the cost job reports it."
          fi
          exit 0

      # Second documented exception (D5): continue-on-error on this single upload
      # only, so an upload failure cannot change this job's result or the drift
      # semantics. Its outcome is exported as cost_upload_outcome and the cost job
      # fails unless it is success, so the failure is never hidden. Exactly the two
      # sanitised files (D8); raw Infracost output stays on this runner.
      - name: Upload Infracost Report
        id: cost_upload
        if: ${{ steps.cost.outputs.cost_status == 'succeeded' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infracost-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cost/report/infracost.json
            ${{ runner.temp }}/cost/report/cost_run.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  # Tasks 8.1/8.3: deterministic drift issues (scripts/github_automation.py). Runs
  # only for a valid classification (literal "true" or "false"; never "unknown"; the
  # implicit success() also requires preflight and plan-and-analyze to have
  # succeeded). "true" creates/updates issues for drifted resources and closes
  # resolved ones; "false" only closes. Its own permissions block replaces the
  # workflow-level one: no id-token, no Azure login, no Terraform. GITHUB_TOKEN is
  # passed only to the script step. The script refuses evidence from any other run
  # attempt (run.run_id == github-<run_id>-<run_attempt>), so a "re-run failed jobs"
  # attempt never publishes. Closing sends only state/state_reason (no body, no
  # comment); issues are never reopened. A failure here does not change
  # drift_detected.
  issues:
    name: "Drift Issues (${{ github.event.inputs.environment || 'dev' }})"
    needs: [preflight, plan-and-analyze]
    if: ${{ needs.plan-and-analyze.outputs.drift_detected == 'true' || needs.plan-and-analyze.outputs.drift_detected == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      DRIFT_ENVIRONMENT: ${{ needs.preflight.outputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Runtime dependencies only (pydantic, PyYAML); no dev/AI/Azure extras.
      - name: Install drift-engine
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input .

      # Same-run artifact (Task 5.4): drift_report.json and detection_run.json only.
      - name: Download Drift Report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drift-report-${{ github.run_id }}
          path: ${{ runner.temp }}/drift-report

      - name: Manage Drift Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_DETECTED: ${{ needs.plan-and-analyze.outputs.drift_detected }}
          REPORT: ${{ runner.temp }}/drift-report/drift_report.json
        run: |
          set -euo pipefail
          python scripts/github_automation.py \
            --report "${REPORT}" \
            --environment "${DRIFT_ENVIRONMENT}" \
            --drift-detected "${DRIFT_DETECTED}" \
            --publish

  # Task 10.1 (D5): makes a cost failure visible. Runs for every valid
  # classification (literal "true" or "false") and fails unless the cost steps in
  # plan-and-analyze succeeded, their artifact upload succeeded, and both sanitised
  # files pass scripts/sanitize_infracost.py --check (allowlist schema, binding to
  # this run attempt and its drift report, Infracost version). A cost failure turns
  # the run red; drift_detected, the drift report and artifact, issues and the
  # report job are unaffected (report keeps needs: [preflight, plan-and-analyze]).
  # Least privilege: contents: read only; no id-token, no Azure, no secrets (the
  # same-run artifact downloads need no token). Summary: totals only.
  cost:
    name: "Cost Estimate (${{ github.event.inputs.environment || 'dev' }})"
    needs: [preflight, plan-and-analyze]
    if: ${{ !cancelled() && (needs.plan-and-analyze.outputs.drift_detected == 'true' || needs.plan-and-analyze.outputs.drift_detected == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Require Cost Success
        env:
          COST_STATUS: ${{ needs.plan-and-analyze.outputs.cost_status }}
          COST_FAILURE: ${{ needs.plan-and-analyze.outputs.cost_failure }}
          COST_UPLOAD_OUTCOME: ${{ needs.plan-and-analyze.outputs.cost_upload_outcome }}
        run: |
          set -euo pipefail
          if [ "${COST_STATUS}" != "succeeded" ]; then
            echo "::error::Cost estimate failed or did not run (cost_status='${COST_STATUS:-not run}', cost_failure='${COST_FAILURE:-n/a}'). Drift result unaffected."
            exit 1
          fi
          if [ "${COST_UPLOAD_OUTCOME}" != "success" ]; then
            echo "::error::Infracost report upload did not succeed (outcome '${COST_UPLOAD_OUTCOME:-n/a}'). Drift result unaffected."
            exit 1
          fi
          echo "cost_status=succeeded, upload=success"

      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Same-run artifacts: the sanitised cost report and the drift report it is
      # bound to (drift_report_sha256, run.run_id, run.environment).
      - name: Download Infracost Report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: infracost-report-${{ github.run_id }}
          path: ${{ runner.temp }}/infracost-report

      - name: Download Drift Report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drift-report-${{ github.run_id }}
          path: ${{ runner.temp }}/drift-report

      # Check mode (I1): exit 0 passed, 1 sanitisation failure, 2 price_not_found,
      # 64 usage. Any non-zero exit fails this job.
      - name: Verify Infracost Report
        env:
          REPORT_DIR: ${{ runner.temp }}/infracost-report
          DRIFT_REPORT: ${{ runner.temp }}/drift-report/drift_report.json
          RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/sanitize_infracost.py --check "${REPORT_DIR}" --run-id "${RUN_ID}" --drift-report "${DRIFT_REPORT}"
          echo "Infracost report verified for ${RUN_ID}."

      # Totals only (D5): no resource names, prices or components. Values are
      # decimal strings (D8); drift cost is computed with Decimal, never floats.
      - name: Cost Summary
        env:
          REPORT_DIR: ${{ runner.temp }}/infracost-report
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os
          from decimal import Decimal
          d = json.load(open(os.path.join(os.environ["REPORT_DIR"], "infracost.json"), encoding="utf-8"))
          run = json.load(open(os.path.join(os.environ["REPORT_DIR"], "cost_run.json"), encoding="utf-8"))
          drift_cost = Decimal(0) - Decimal(d["diffTotalMonthlyCost"])
          print("### Cost estimate (Infracost, list prices)")
          print("")
          print("| Field | Value |")
          print("| --- | --- |")
          print(f"| Actual monthly cost (prior state) | {d['pastTotalMonthlyCost']} {d['currency']} |")
          print(f"| Desired monthly cost (planned) | {d['totalMonthlyCost']} {d['currency']} |")
          print(f"| Diff (desired - actual) | {d['diffTotalMonthlyCost']} {d['currency']} |")
          print(f"| Drift cost (-diff) | {drift_cost} {d['currency']} |")
          print(f"| Infracost | `{run['infracost_version']}` ({run['pricing']}) |")
          print(f"| Run | `{run['run_id']}` |")
          PY

  # Task 9B.5 (G10): makes the drift investigation's outcome visible. Runs for every
  # valid classification (literal "true" or "false"). It verifies the uploaded public
  # investigation against the downloaded PUBLIC drift report (item 3), writes a
  # counts-only summary, and then decides the job result (Require Investigation
  # Success, last so the summary still renders; G18, which amends decision 1):
  # succeeded passes; incomplete passes with a warning; failed (incl. an uploaded
  # failed-but-bindable investigation) fails; a failed upload or verification fails.
  # An investigation is required only for a drifted run: one that never ran fails
  # when drift_detected is "true" and passes ("not required") when it is "false".
  # drift_detected decides only that; drift itself never fails it. drift_detected,
  # the drift report and artifact, issues, cost and the report job are unaffected (report keeps
  # needs: [preflight, plan-and-analyze]). Least privilege: contents: read only; no
  # id-token, no Azure, no secrets (same-run artifact downloads need no token).
  investigation:
    name: "Drift Investigation (${{ github.event.inputs.environment || 'dev' }})"
    needs: [preflight, plan-and-analyze]
    if: ${{ !cancelled() && (needs.plan-and-analyze.outputs.drift_detected == 'true' || needs.plan-and-analyze.outputs.drift_detected == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UPLOADED: ${{ needs.plan-and-analyze.outputs.investigation_upload_outcome == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          set-safe-directory: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Runtime dependencies only (pydantic, PyYAML); no Azure, AI or dev extras.
      - name: Install drift-engine
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input .

      - name: Download Drift Report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drift-report-${{ github.run_id }}
          path: ${{ runner.temp }}/drift-report

      - name: Download Drift Investigation
        if: ${{ env.UPLOADED == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drift-investigation-${{ github.run_id }}
          path: ${{ runner.temp }}/drift-investigation

      # Contract, leak scan and binding to the downloaded PUBLIC drift report.
      - name: Verify Drift Investigation
        id: verify
        if: ${{ env.UPLOADED == 'true' }}
        run: |
          set -euo pipefail
          drift-engine investigation-check \
            --public "${RUNNER_TEMP}/drift-investigation/drift_investigation.json" \
            --report "${RUNNER_TEMP}/drift-report/drift_report.json"

      # Counts and fixed codes only: no caller, ID or Activity Log text.
      - name: Investigation Summary
        if: ${{ !cancelled() }}
        env:
          INVESTIGATION_STATUS: ${{ needs.plan-and-analyze.outputs.investigation_status }}
          INVESTIGATION_FAILURE: ${{ needs.plan-and-analyze.outputs.investigation_failure }}
          INVESTIGATION_DETAIL: ${{ needs.plan-and-analyze.outputs.investigation_detail }}
          INVESTIGATION_UPLOAD_OUTCOME: ${{ needs.plan-and-analyze.outputs.investigation_upload_outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os, re
          from collections import Counter
          code = lambda name: (os.environ.get(name) or "n/a") if re.fullmatch(r"[a-z0-9_=,.-]{0,400}", os.environ.get(name) or "") else "invalid"
          print("### Drift investigation")
          print("")
          print("| Field | Value |")
          print("| --- | --- |")
          for label, name in (("Status", "INVESTIGATION_STATUS"), ("Failure", "INVESTIGATION_FAILURE"),
                              ("Detail", "INVESTIGATION_DETAIL"), ("Upload", "INVESTIGATION_UPLOAD_OUTCOME"),
                              ("Verification", "VERIFY_OUTCOME")):
              print(f"| {label} | `{code(name)}` |")
          path = os.path.join(os.environ["RUNNER_TEMP"], "drift-investigation", "drift_investigation.json")
          if os.environ.get("VERIFY_OUTCOME") == "success" and os.path.isfile(path):
              doc = json.load(open(path, encoding="utf-8"))
              verdicts = Counter(r["verdict"] for r in doc["resources"])
              print(f"| Outcome | `{doc['outcome']}` |")
              print(f"| Resources | {len(doc['resources'])} |")
              print(f"| Verdicts | `{', '.join(f'{k}={v}' for k, v in sorted(verdicts.items())) or 'none'}` |")
              print(f"| Anchors | examined {doc['anchors']['examined']}, accepted {doc['anchors']['accepted']} |")
              print(f"| Artifact | `drift-investigation-{os.environ['GITHUB_RUN_ID']}` (30 days) |")
          PY

      # G18: drift_detected is read only to decide whether an investigation was
      # required (a drifted run); drift itself never fails this step.
      - name: Require Investigation Success
        if: ${{ !cancelled() }}
        env:
          DRIFT_DETECTED: ${{ needs.plan-and-analyze.outputs.drift_detected }}
          INVESTIGATION_STATUS: ${{ needs.plan-and-analyze.outputs.investigation_status }}
          INVESTIGATION_FAILURE: ${{ needs.plan-and-analyze.outputs.investigation_failure }}
          INVESTIGATION_UPLOAD_OUTCOME: ${{ needs.plan-and-analyze.outputs.investigation_upload_outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${INVESTIGATION_STATUS}" ]; then
            if [ "${DRIFT_DETECTED}" = "false" ]; then
              printf '\nDrift investigation: not required: no drift.\n' >> "${GITHUB_STEP_SUMMARY}"
              echo "Drift investigation did not run: not required: no drift."
              exit 0
            fi
            echo "::error::Drift investigation is required for a drifted run but did not run. Drift result unaffected."
            exit 1
          fi
          case "${INVESTIGATION_STATUS}" in
            succeeded | incomplete) ;;
            *) echo "::error::Drift investigation did not succeed (status '${INVESTIGATION_STATUS}', failure '${INVESTIGATION_FAILURE:-n/a}'). Drift result unaffected."
               exit 1 ;;
          esac
          if [ "${INVESTIGATION_UPLOAD_OUTCOME}" != "success" ]; then
            echo "::error::Drift investigation upload did not succeed (outcome '${INVESTIGATION_UPLOAD_OUTCOME:-n/a}'). Drift result unaffected."
            exit 1
          fi
          if [ "${VERIFY_OUTCOME}" != "success" ]; then
            echo "::error::The uploaded drift investigation failed verification against the public drift report. Drift result unaffected."
            exit 1
          fi
          if [ "${INVESTIGATION_STATUS}" = "incomplete" ]; then
            echo "::warning::Drift investigation incomplete: some facts are not confirmed by available evidence (see the investigation summary). A finding, not a failure; drift result unaffected."
          fi
          echo "investigation_status=${INVESTIGATION_STATUS}, upload=success, verification=success"

  # Task 10.4: unmanaged Azure resources (outside Terraform) and their list-price estimate.
  # Runs for every valid classification (literal "true" or "false"). Least privilege:
  # contents: read only; no id-token, no Azure login, no secrets. It prices the uploaded
  # public inventory with the public Azure Retail Prices API (prices.azure.com, GET only, no
  # credential; the only egress), verifies both documents against the downloaded PUBLIC drift
  # report, uploads unmanaged-resources-<run_id>, writes the summary section, and then decides
  # the job result (Require Unmanaged Inventory, last so the summary still renders):
  #   inventory complete + pricing complete/partial -> success; unmanaged resources found or
  #     estimates unavailable/partial -> a warning (a finding, never a failure; decision 2);
  #   inventory failed/incomplete/not uploaded, a Retail Prices API failure, a failed
  #     verification or upload -> the job fails (explicit; never a clean or $0 result).
  # Never changes drift_detected, the drift report or artifact, issues, cost, the
  # investigation or the report job (report keeps needs: [preflight, plan-and-analyze]).
  unmanaged:
    name: "Unmanaged Resources (${{ github.event.inputs.environment || 'dev' }})"
    needs: [preflight, plan-and-analyze]
    if: ${{ !cancelled() && (needs.plan-and-analyze.outputs.drift_detected == 'true' || needs.plan-and-analyze.outputs.drift_detected == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UPLOADED: ${{ needs.plan-and-analyze.outputs.inventory_upload_outcome == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          set-safe-directory: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Runtime dependencies only (pydantic, PyYAML); the Retail Prices client is the standard library.
      - name: Install drift-engine
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input .

      - name: Download Drift Report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drift-report-${{ github.run_id }}
          path: ${{ runner.temp }}/drift-report

      - name: Download Unmanaged Inventory
        if: ${{ env.UPLOADED == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unmanaged-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/unmanaged

      # drift-engine unmanaged-cost: exit 0 priced (complete or partial), 1 failed or not run (still
      # written), anything else unusable. The exit code is recorded; Require Unmanaged Inventory decides.
      - name: Price Unmanaged Resources
        id: price
        if: ${{ env.UPLOADED == 'true' }}
        run: |
          set -uo pipefail
          rc=0
          drift-engine unmanaged-cost \
            --inventory "${RUNNER_TEMP}/unmanaged/unmanaged_inventory.json" \
            --report "${RUNNER_TEMP}/drift-report/drift_report.json" \
            --output "${RUNNER_TEMP}/unmanaged/unmanaged_cost.json" || rc=$?
          echo "pricing_exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          [ "${rc}" -eq 0 ] || [ "${rc}" -eq 1 ]

      # Leak scan, contracts and binding (inventory -> PUBLIC drift report, cost -> inventory).
      - name: Verify Unmanaged Documents
        id: verify
        if: ${{ !cancelled() && steps.price.outcome == 'success' }}
        run: |
          set -euo pipefail
          drift-engine unmanaged-check \
            --inventory "${RUNNER_TEMP}/unmanaged/unmanaged_inventory.json" \
            --cost "${RUNNER_TEMP}/unmanaged/unmanaged_cost.json" \
            --report "${RUNNER_TEMP}/drift-report/drift_report.json"

      - name: Upload Unmanaged Resources Report
        id: report_upload
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unmanaged-resources-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/unmanaged/unmanaged_inventory.json
            ${{ runner.temp }}/unmanaged/unmanaged_cost.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      # Fixed codes and counts first; then, for verified documents, the section written by
      # unmanaged-check (types, names, estimates, statuses; never a resource ID).
      - name: Unmanaged Summary
        if: ${{ !cancelled() }}
        env:
          INVENTORY_STATUS: ${{ needs.plan-and-analyze.outputs.inventory_status }}
          INVENTORY_FAILURE: ${{ needs.plan-and-analyze.outputs.inventory_failure }}
          INVENTORY_DETAIL: ${{ needs.plan-and-analyze.outputs.inventory_detail }}
          INVENTORY_UPLOAD_OUTCOME: ${{ needs.plan-and-analyze.outputs.inventory_upload_outcome }}
          PRICING_EXIT_CODE: ${{ steps.price.outputs.pricing_exit_code }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import os, re
          code = lambda name: (os.environ.get(name) or "n/a") if re.fullmatch(r"[a-z0-9_=,.-]{0,400}", os.environ.get(name) or "") else "invalid"
          print("### Unmanaged resource inventory (Task 10.4)")
          print("")
          print("| Field | Value |")
          print("| --- | --- |")
          for label, name in (("Inventory", "INVENTORY_STATUS"), ("Failure", "INVENTORY_FAILURE"),
                              ("Detail", "INVENTORY_DETAIL"), ("Upload", "INVENTORY_UPLOAD_OUTCOME"),
                              ("Pricing exit code", "PRICING_EXIT_CODE"), ("Verification", "VERIFY_OUTCOME")):
              print(f"| {label} | `{code(name)}` |")
          print("")
          PY
          if [ "${VERIFY_OUTCOME}" = "success" ]; then
            drift-engine unmanaged-check \
              --inventory "${RUNNER_TEMP}/unmanaged/unmanaged_inventory.json" \
              --cost "${RUNNER_TEMP}/unmanaged/unmanaged_cost.json" \
              --report "${RUNNER_TEMP}/drift-report/drift_report.json" \
              --summary-markdown "${GITHUB_STEP_SUMMARY}"
            echo "| Artifact | \`unmanaged-resources-${GITHUB_RUN_ID}\` (30 days) |" >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Decision 2 (Task 10.4): findings never fail; failures are explicit.
      - name: Require Unmanaged Inventory
        if: ${{ !cancelled() }}
        env:
          INVENTORY_STATUS: ${{ needs.plan-and-analyze.outputs.inventory_status }}
          INVENTORY_FAILURE: ${{ needs.plan-and-analyze.outputs.inventory_failure }}
          INVENTORY_UPLOAD_OUTCOME: ${{ needs.plan-and-analyze.outputs.inventory_upload_outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          REPORT_UPLOAD_OUTCOME: ${{ steps.report_upload.outcome }}
        run: |
          set -euo pipefail
          if [ "${INVENTORY_STATUS}" != "complete" ]; then
            echo "::error::Unmanaged resource inventory did not complete (status '${INVENTORY_STATUS:-not run}', failure '${INVENTORY_FAILURE:-n/a}'): the result is not a clean inventory. Drift result unaffected."
            exit 1
          fi
          if [ "${INVENTORY_UPLOAD_OUTCOME}" != "success" ] || [ "${VERIFY_OUTCOME}" != "success" ] || [ "${REPORT_UPLOAD_OUTCOME}" != "success" ]; then
            echo "::error::Unmanaged documents were not uploaded or verified (inventory upload '${INVENTORY_UPLOAD_OUTCOME:-n/a}', verification '${VERIFY_OUTCOME:-n/a}', report upload '${REPORT_UPLOAD_OUTCOME:-n/a}'). Drift result unaffected."
            exit 1
          fi
          read -r status failure unmanaged unavailable partial < <(python3 -c 'import json, os, sys
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "unmanaged", "unmanaged_cost.json"), encoding="utf-8"))
          t = d["totals"]
          print(d["status"], d["failure"] or "-", t["resources"], t["unavailable"], t["partial"])')
          case "${status}" in
            complete | partial) ;;
            *) echo "::error::Unmanaged cost estimate ${status} (${failure}): the Retail Prices API failed; estimates are unavailable, never \$0. Drift result unaffected."
               exit 1 ;;
          esac
          if [ "${unmanaged}" -gt 0 ]; then
            echo "::warning::${unmanaged} Azure resource(s) not managed by Terraform found in its resource groups (a finding, not drift and not a failure; see the summary)."
          fi
          if [ "${status}" = "partial" ]; then
            echo "::warning::Unmanaged cost estimate is partial: ${unavailable} unavailable and ${partial} partial estimate(s); the total covers only the priced part."
          fi
          echo "inventory=complete, pricing=${status}, unmanaged=${unmanaged}"

  # Runs after failures too (not after cancellation) so every completed run
  # reports its result. It only reports: the run's red/green status comes from the
  # jobs above, and this job never turns a failed run green. It reads job outputs
  # only (no checkout, no Azure access, no plan evidence).
  report:
    name: "Report & Summary (${{ github.event.inputs.environment || 'dev' }})"
    needs: [preflight, plan-and-analyze]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRIFT_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    # Same values as the plan-and-analyze outputs, but also "unknown" when that job
    # never ran (e.g. preflight failed), where its own outputs would be empty.
    outputs:
      drift_detected: ${{ needs.plan-and-analyze.outputs.drift_detected || 'unknown' }}
      drift_status: ${{ needs.plan-and-analyze.outputs.drift_status || 'UNKNOWN' }}

    steps:
      - name: Run Summary
        env:
          WORK_DIR: ${{ needs.preflight.outputs.working_directory }}
          VAR_FILE: ${{ needs.preflight.outputs.var_file }}
          PLAN_EXIT_CODE: ${{ needs.plan-and-analyze.outputs.plan_exit_code || 'n/a' }}
          DRIFT_STATUS: ${{ needs.plan-and-analyze.outputs.drift_status || 'UNKNOWN' }}
          DRIFT_DETECTED: ${{ needs.plan-and-analyze.outputs.drift_detected || 'unknown' }}
          CLASSIFICATION_COUNTS: ${{ needs.plan-and-analyze.outputs.classification_counts || 'n/a' }}
          # Step outcomes in execution order: success, failure or skipped (a job
          # that never ran exposes no outputs, so its steps read as skipped).
          STAGE_OUTCOMES: >-
            Require main branch=${{ needs.preflight.outputs.guard_outcome || 'skipped' }};
            Checkout Code=${{ needs.preflight.outputs.checkout_outcome || 'skipped' }};
            Resolve Environment=${{ needs.preflight.outputs.context_outcome || 'skipped' }};
            Checkout Code (plan)=${{ needs.plan-and-analyze.outputs.checkout_outcome || 'skipped' }};
            Azure OIDC Login=${{ needs.plan-and-analyze.outputs.login_outcome || 'skipped' }};
            Verify Azure OIDC Authentication=${{ needs.plan-and-analyze.outputs.auth_outcome || 'skipped' }};
            Verify Terraform State Storage=${{ needs.plan-and-analyze.outputs.state_guard_outcome || 'skipped' }};
            Setup Terraform=${{ needs.plan-and-analyze.outputs.tf_setup_outcome || 'skipped' }};
            Terraform Init (remote backend)=${{ needs.plan-and-analyze.outputs.tf_init_outcome || 'skipped' }};
            Terraform Validate=${{ needs.plan-and-analyze.outputs.tf_validate_outcome || 'skipped' }};
            Setup Python=${{ needs.plan-and-analyze.outputs.py_setup_outcome || 'skipped' }};
            Install drift-engine=${{ needs.plan-and-analyze.outputs.install_outcome || 'skipped' }};
            Generate Plan Evidence=${{ needs.plan-and-analyze.outputs.evidence_outcome || 'skipped' }};
            Analyze Drift=${{ needs.plan-and-analyze.outputs.analyze_outcome || 'skipped' }};
            Upload Drift Report=${{ needs.plan-and-analyze.outputs.upload_outcome || 'skipped' }}
          # Job results, so a job-level failure (e.g. a timeout) with no failed
          # step is still reported.
          JOB_RESULTS: >-
            Preflight job=${{ needs.preflight.result }};
            Terraform Plan & Drift Analysis job=${{ needs.plan-and-analyze.result }}
          INIT_OUTCOME: ${{ needs.plan-and-analyze.outputs.tf_init_outcome }}
          VALIDATE_OUTCOME: ${{ needs.plan-and-analyze.outputs.tf_validate_outcome }}
          UPLOAD_OUTCOME: ${{ needs.plan-and-analyze.outputs.upload_outcome }}
        run: |
          set -euo pipefail
          failed_stage="none"
          stages="${STAGE_OUTCOMES//; /;}"
          IFS=';' read -r -a pairs <<< "${stages}"
          for pair in "${pairs[@]}"; do
            if [ "${pair##*=}" = "failure" ]; then failed_stage="${pair%=*}"; break; fi
          done
          if [ "${failed_stage}" = "none" ]; then
            jobs="${JOB_RESULTS//; /;}"
            IFS=';' read -r -a pairs <<< "${jobs}"
            for pair in "${pairs[@]}"; do
              case "${pair##*=}" in
                failure|cancelled) failed_stage="${pair%=*} (${pair##*=})"; break ;;
              esac
            done
          fi

          # A result is valid only when no stage failed and drift-engine produced a
          # boolean; anything else is reported as FAILED with drift status UNKNOWN.
          if [ "${failed_stage}" = "none" ] && { [ "${DRIFT_DETECTED}" = true ] || [ "${DRIFT_DETECTED}" = false ]; }; then
            result="VALID"
          else
            result="FAILED - drift status UNKNOWN"
            DRIFT_STATUS="UNKNOWN"
            DRIFT_DETECTED="unknown"
          fi
          if [ "${INIT_OUTCOME}" = success ] && [ "${VALIDATE_OUTCOME}" = success ]; then
            backend="AzureRM remote state, initialized and validated"
          else
            backend="not initialized/validated (init ${INIT_OUTCOME:-n/a}, validate ${VALIDATE_OUTCOME:-n/a})"
          fi
          if [ "${UPLOAD_OUTCOME}" = success ]; then
            artifact="\`drift-report-${GITHUB_RUN_ID}\` (drift_report.json + detection_run.json, 30 days)"
          else
            artifact="not uploaded"
          fi

          {
            echo "### Drift detection run"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | **${result}** |"
            echo "| Failed stage | ${failed_stage} |"
            echo "| Drift status | **${DRIFT_STATUS}** |"
            echo "| drift_detected | \`${DRIFT_DETECTED}\` |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Environment | \`${DRIFT_ENVIRONMENT}\` |"
            echo "| Working directory | \`${WORK_DIR:-n/a}\` |"
            echo "| Variable file | \`${VAR_FILE:-n/a}\` |"
            echo "| Terraform | \`${TERRAFORM_VERSION}\` |"
            echo "| Azure auth | OIDC (no client secret) |"
            echo "| Backend | ${backend} |"
            echo "| Plan exit code | \`${PLAN_EXIT_CODE}\` (0 = no pending changes, 2 = pending changes) |"
            echo "| Classification | \`${CLASSIFICATION_COUNTS}\` |"
            echo "| Artifact | ${artifact} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Drift detection for '${DRIFT_ENVIRONMENT}' (${GITHUB_EVENT_NAME}): result ${result}; drift_detected=${DRIFT_DETECTED}; failed stage: ${failed_stage}."
