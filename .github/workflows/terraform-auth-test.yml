name: "Phase 2 - Terraform Azure Auth & Validation"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Least privilege: only the authenticated job below is granted `id-token: write`.
permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.14.7"

jobs:
  # Runs for every event, pull requests included. No Azure login, no OIDC token,
  # no repository secret and no Terraform state: the same offline checks as
  # scripts/validate.sh (fmt, then init -backend=false and validate per root).
  offline-validate:
    name: "Terraform Offline Validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Wrapper disabled (Task 12.1A, E6): the real terraform binary, no echo of output.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      # Bootstrap intentionally uses LOCAL state, which is excluded from Git by
      # .gitignore and therefore never present in CI. Planning here would compare
      # against empty state and propose re-creating the already-deployed state
      # infrastructure. CI is restricted to offline validation only — matching
      # the pattern already used by scripts/validate.sh.
      - name: Validate Bootstrap Configuration (offline, no state)
        run: |
          set -euo pipefail
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate

      # The remote AzureRM backend is not initialized here (-backend=false), so
      # this needs no Azure credential and reads or changes no state.
      - name: Validate Dev Environment Configuration (offline, no state)
        run: |
          set -euo pipefail
          terraform -chdir=terraform/environments/dev init -backend=false -input=false
          terraform -chdir=terraform/environments/dev validate

  # Azure OIDC login and the read-only dev plan. Never on pull requests: the only
  # federated credential trusts this repository's `main` branch, and pull request
  # code is not given an Azure token. Push and manual runs keep the full check.
  validate-and-plan:
    name: "Terraform OIDC Auth & Plan Test"
    if: github.event_name != 'pull_request'
    needs: offline-validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure OIDC Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fails the job loudly if OIDC login did not produce a usable context,
      # rather than letting a broken credential surface later as a confusing
      # Terraform backend error.
      # Task 12.1A (E6, P2): the context is compared with the configured values
      # and never printed (no reliance on secret masking). Only a fixed line or a
      # fixed failure code reaches the public log.
      - name: Verify Azure OIDC Authentication
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set +x
          set -uo pipefail
          norm() { printf '%s' "$1" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'; }
          if [ -z "${EXPECTED_SUBSCRIPTION_ID:-}" ] || [ -z "${EXPECTED_TENANT_ID:-}" ]; then
            echo "::error::Azure auth check failed: failure_code=auth_configuration_missing"
            exit 1
          fi
          if ! actual_subscription="$(az account show --only-show-errors --query id --output tsv 2>/dev/null)" \
            || ! actual_tenant="$(az account show --only-show-errors --query tenantId --output tsv 2>/dev/null)" \
            || [ -z "$(norm "${actual_subscription}")" ] || [ -z "$(norm "${actual_tenant}")" ]; then
            echo "::error::Azure auth check failed: failure_code=auth_context_unavailable"
            exit 1
          fi
          if [ "$(norm "${actual_subscription}")" != "$(norm "${EXPECTED_SUBSCRIPTION_ID}")" ] \
            || [ "$(norm "${actual_tenant}")" != "$(norm "${EXPECTED_TENANT_ID}")" ]; then
            echo "::error::Azure auth check failed: failure_code=auth_context_mismatch"
            exit 1
          fi
          echo "Azure OIDC context verified (subscription and tenant match the configured values; not printed)."

      # Account switching (docs/azure-account-switching.md): dev/backend.tf is a partial
      # backend. The state location comes from repository variables and is used only
      # after the storage account is proven to belong to the signed-in subscription;
      # only the state key and fixed lines are printed.
      - name: Verify Terraform State Storage
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          BACKEND_CONFIG: ${{ runner.temp }}/backend.hcl
        run: ./scripts/resolve_backend_config.sh

      # Wrapper disabled (Task 12.1A, E6): the real terraform binary gives the real
      # `plan -detailed-exitcode` exit codes and never echoes output to the log.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Dev uses the AzureRM remote backend. Authentication is OIDC end to end:
      #   ARM_USE_OIDC    - exchange the GitHub ID token for an Azure token
      #   ARM_USE_AZUREAD - authenticate to the storage data plane with Entra ID
      #                     instead of storage account access keys, so the
      #                     identity needs only Storage Blob Data Contributor
      #                     on the state container (least privilege).
      # No client secret or storage account key is used anywhere.
      # Task 12.1A (E6, P1): init, validate, plan and show run in
      # scripts/auth_test_plan.sh with every output in runner-local files under
      # $RUNNER_TEMP/auth-test (never printed, never uploaded). The log shows only
      # the Terraform version, the stage results, the plan exit code and
      # validated action counts, or one fixed failure code.
      - name: Validate Dev Environment Configuration
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          BACKEND_CONFIG: ${{ runner.temp }}/backend.hcl
        run: ./scripts/auth_test_plan.sh
